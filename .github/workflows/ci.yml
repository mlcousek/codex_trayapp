name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore CodexTrayApp.sln
      - name: Release build
        run: dotnet build CodexTrayApp.sln -c Release --no-restore
      - name: Core and Windows tests
        run: dotnet test --solution CodexTrayApp.sln -c Release --no-build --minimum-expected-tests 1
